name: PX4 SITL survey flight

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fly_survey.py'
      - 'tools/inspect_ulog.py'
      - '.github/workflows/px4-survey.yml'

jobs:
  fly:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PX4
        run: |
          git clone --recursive --depth 1 -b v1.15.4 https://github.com/PX4/PX4-Autopilot.git px4
          cd px4 && git describe --tags

      - name: Install toolchain
        run: |
          # PX4's ubuntu.sh pulls Gazebo + gstreamer, and libgstreamer1.0-dev has an
          # unmet libunwind-dev dependency on this image. We only need jMAVSim, so
          # install exactly that instead of fighting apt.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache git \
            python3-dev python3-pip python3-setuptools \
            openjdk-11-jdk ant libunwind-dev
          python3 -m pip install --quiet -r px4/Tools/setup/requirements.txt
          python3 -m pip install --quiet pymavlink pyulog
          cmake --version && java -version 2>&1 | head -1

      - name: Build SITL
        run: |
          cd px4
          make px4_sitl_default -j$(nproc) 2>&1 | tail -15
          ls -la build/px4_sitl_default/bin/px4

      - name: Fly the survey
        run: |
          cd px4
          # speed factor 1: at 4x the log covered 32 min of sim time and hit 439 MB
          export HEADLESS=1 PX4_SIM_SPEED_FACTOR=1
          nohup make px4_sitl jmavsim > /tmp/sitl.log 2>&1 &
          for i in $(seq 1 120); do
            grep -q "Ready for takeoff" /tmp/sitl.log && break
            sleep 2
          done
          tail -25 /tmp/sitl.log
          python3 ../tools/fly_survey.py || echo "mission script exited non-zero"
          sleep 8
          pkill -f px4 || true
          sleep 3

      - name: Collect and inspect ULog
        run: |
          mkdir -p out
          find px4/build/px4_sitl_default/rootfs/log -name '*.ulg' -exec cp {} out/ \; || true
          ls -la out/ || echo "NO LOGS FOUND"
          python3 tools/inspect_ulog.py 'out/*.ulg' || true
          for f in out/*.ulg; do
            sz=$(stat -c%s "$f")
            echo "$f is $((sz/1024/1024)) MB"
            [ "$sz" -gt 104857600 ] && echo "WARNING: over Flight Review's ~100 MB limit"
          done
          echo "--- sitl tail ---"
          tail -40 /tmp/sitl.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: px4-survey-ulog
          path: out/*.ulg
          if-no-files-found: warn
          retention-days: 30
